version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: the compiler must match the TypeScript version
      # bundled inside monaco-editor (see src/lib/compiler/options.ts).
      # Bump both together, by hand.
      - dependency-name: typescript
      - dependency-name: monaco-editor
      - dependency-name: "@monaco-editor/react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
