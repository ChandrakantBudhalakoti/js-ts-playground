name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Types · Format · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` fails if package-lock.json is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint (warnings are errors)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify production security headers
        run: |
          npx next start -p 3300 > next-start.log 2>&1 &
          node scripts/verify-security-headers.mjs http://localhost:3300

      - name: Show server log
        if: failure()
        run: cat next-start.log || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Production dependencies only: anything high or critical fails the build.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser tests (Chromium · Firefox · mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # The Playwright config builds the app and runs it with `next start`,
      # so these tests exercise the production bundle and its CSP headers.
      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
